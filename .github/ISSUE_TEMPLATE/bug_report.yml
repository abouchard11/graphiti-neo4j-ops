name: Bug report
description: Report a reproducible problem with the operations stack
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include passwords, `.env` contents, dumps, or private paths.
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS, CPU architecture, and Docker version
      placeholder: macOS 15, Apple Silicon, Docker Desktop 4.x
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include sanitized logs and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, dumps, and private filesystem paths.
          required: true
